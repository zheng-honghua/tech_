[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-vision"
version = "0.2.0"
description = "RGB-D 3-D vision and suction grasp pipeline for intelligent sorting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sorting-vision = "sorting_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
