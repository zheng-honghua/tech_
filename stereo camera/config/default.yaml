tray:
  width_mm: 160.0
  height_mm: 160.0
  rectified_width_px: 640
  rectified_height_px: 640

segmentation:
  background_delta: 22.0
  retry_threshold_scale: 0.75
  min_area_px: 700
  max_area_px: 90000
  morphology_kernel: 5
  split_touching: true
  watershed_peak_ratio: 0.65
  min_clearance_px: 10.0
  border_margin_px: 4

classification:
  max_color_distance: 48.0
  min_color_confidence: 0.72
  min_shape_confidence: 0.68
  min_pick_confidence: 0.72
  colors:
    red: {name: "红色", hex: "#d83b36"}
    yellow: {name: "黄色", hex: "#e2c43f"}
    blue: {name: "蓝色", hex: "#3e67c6"}
    green: {name: "绿色", hex: "#4b9e55"}
    black: {name: "黑色", hex: "#252525"}
    cyan: {name: "浅蓝色", hex: "#59bfd0"}
  shapes:
    triangle: "三角形"
    square: "正方形"
    rectangle: "长方形"
    pentagon: "五边形"
    hexagon: "六边形"
    circle: "圆形"
    cube: "立方体"
    cuboid: "长方体"
    triangular_prism: "三棱柱"
    triangular_pyramid: "三棱锥"
    square_pyramid: "四棱锥"
    pentagonal_prism: "五棱柱"
    pentagonal_pyramid: "五棱锥"
    hexagonal_prism: "六棱柱"
    hexagonal_pyramid: "六棱锥"
    octahedron: "正八面体"
    cone: "圆锥"
    cylinder: "圆柱体"
    sphere: "球体"
    unknown: "未知形状"

selection:
  stable_frames: 2
  prefer_clearance_weight: 0.25

rgbd:
  processing_scale: 0.75
  # D435if minimum Z at the configured maximum depth resolution is about 280 mm.
  min_depth_mm: 280.0
  max_depth_mm: 1500.0
  foreground_height_mm: 3.0
  max_object_height_mm: 80.0
  min_valid_depth_ratio: 0.85
  plane_ransac_threshold_mm: 1.5
  max_plane_shift_mm: 3.0
  max_rgb_depth_sync_ms: 20.0
  point_sample_stride: 2
  min_area_px: 250
  max_area_px: 120000
  morphology_kernel: 5
  border_margin_px: 4
  min_clearance_px: 8.0

grasp:
  cup_diameter_mm: 15.0
  edge_margin_mm: 2.0
  max_flatness_rmse_mm: 1.2
  max_tilt_deg: 35.0
  min_patch_valid_ratio: 0.9
  candidate_stride_px: 4
  max_candidates: 3
  min_grasp_score: 0.72

network:
  host: "127.0.0.1"
  port: 8765

camera:
  width: 1920
  height: 1080
  fps: 30
  warmup_frames: 30
  reconnect_attempts: 3
  realsense_model: "Intel RealSense D435if"
  realsense_frame_prefix: "d435if"
  realsense_color_width: 1920
  realsense_color_height: 1080
  realsense_depth_width: 848
  realsense_depth_height: 480
  realsense_fps: 30

dual_view:
  # The legacy commands remain monocular unless --source dual is selected.
  enabled: false
  platform_id: "temporary"
  calibration_path: "config/dual/temporary/calibration.json"
  side_background_path: "config/dual/temporary/side-background.png"
  side_model_path: "models/side-geometry.npz"
  fixed_tag_a_id: 0
  fixed_tag_b_id: 1
  free_tag_id: 2
  side_camera_index: 1
  side_width: 1280
  side_height: 720
  side_fps: 30
  # UVC control support is device/backend dependent. Failed controls are
  # reported by OpenCVCameraSource.control_status and must be checked on site.
  side_auto_exposure: false
  side_exposure: -6.0
  side_auto_white_balance: false
  side_white_balance: 4500.0
  side_autofocus: false
  side_focus: null
  max_pair_delta_ms: 50.0
  pair_timeout_ms: 250.0
  min_side_quality: 0.60
  side_weight: 0.30
  conflict_probability: 0.75
  fused_probability: 0.72
  fused_margin: 0.12
  top_only_probability: 0.85
  roi_overlap_threshold: 0.30
  roi_padding_ratio: 0.15
  side_background_delta: 22.0
  side_min_area_px: 120
  side_min_blur_variance: 35.0
  top_temperature: 1.0
  side_temperature: 1.0

motion_interlock:
  min_settle_ms: 300.0
  discard_frames: 8
  stable_frames: 3
  frame_diff_threshold: 2.5
  timeout_ms: 2000.0
