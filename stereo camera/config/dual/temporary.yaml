extends: ../default.yaml

camera:
  # Conservative primary stream used by the temporary platform.
  realsense_color_width: 1920
  realsense_color_height: 1080
  realsense_depth_width: 848
  realsense_depth_height: 480
  realsense_fps: 15
  warmup_frames: 3

dual_view:
  enabled: true
  # In this Windows Python stack the UVC reader must live in a separate
  # process; a bounded JPEG queue keeps IPC overhead controlled.
  # Keep RealSense draining in a dedicated parent-process thread while the
  # side UVC camera runs in its isolated process. Recognition consumes the
  # newest paired frames without blocking either capture loop.
  acquisition_mode: "threaded"
  side_process_isolation: true
  platform_id: "temporary"
  calibration_path: "config/dual/temporary/calibration.json"
  # Calibrate each RGB camera separately before solving three-tag geometry.
  primary_intrinsics_path: "config/dual/temporary/primary-intrinsics.json"
  side_intrinsics_path: "config/dual/temporary/side-intrinsics.json"
  side_background_path: "config/dual/temporary/side-background.png"
  side_model_path: "models/side-geometry.npz"
  shape_registry_path: "config/shapes/competition-11.yaml"
  fusion_policy_path: "models/dual-fusion-policy.json"
  fusion_method: "log_product"
  fusion_backend: "auto"
  # Persistent three-AprilTag IDs; command-line flags can override one run.
  fixed_tag_a_id: 45
  fixed_tag_b_id: 17
  free_tag_id: 50
  # DirectShow re-enumeration on 2026-09-10: index 0 is the unavailable
  # integrated camera, index 1 is the external USB Camera, and index 2 is
  # RealSense RGB. Re-probe after USB or Windows camera-device changes.
  side_camera_index: 1
  # The side camera declares native 1280x720@30 YUY2 and NV12 streams. NV12
  # lowers bus traffic and must be applied after width/height/fps.
  side_width: 1280
  side_height: 720
  side_fps: 30
  side_backend: "DSHOW"
  side_fourcc: "NV12"
  side_auto_exposure: true
  side_exposure: null
  side_auto_white_balance: true
  side_white_balance: null
  max_pair_delta_ms: 50.0
  pair_timeout_ms: 2000.0
  # Development-only profile. Recalibrate before changing the rigid mount.
  # These relaxed gates are only for temporary-platform fusion diagnostics.
  # Competition keeps the strict 3 px / 1% promotion gates.
  calibration_quality_profile: "temporary_relaxed"
  calibration_max_primary_rms_px: 0.8
  calibration_max_side_rms_px: 0.8
  calibration_max_joint_projection_p95_px: 3.5
  calibration_max_scale_error_ratio: 0.035
